# Every branch (dev and prod included) and pull request, when something built
# or tested changed; manual runs always. Each step is a part of scripts/ci.sh,
# so a red step says what failed; steps share the workspace (target/ carries over).
when:
  - event: [push, pull_request]
    # Nothing built or tested changed: docs, the roadmap, try/, repo housekeeping.
    path:
      exclude: ["**/*.md", "roadmap/**", "try/**", "LICENSE", ".gitignore", ".githooks/**", "docker-compose.yml", "cliff.toml"]
    # Not the release merge coming back into dev: prod just tested that very code.
    evaluate: 'not (CI_COMMIT_BRANCH == "dev" && CI_COMMIT_MESSAGE startsWith "Merge branch ''dev'' into prod")'
  - event: manual

services:
  - name: postgres
    image: postgres:18
    environment:
      POSTGRES_USER: theca
      POSTGRES_PASSWORD: theca
      POSTGRES_DB: theca
      # Same as docker-compose.yml: the server refuses other collations.
      POSTGRES_INITDB_ARGS: --locale-provider=builtin --builtin-locale=C.UTF-8

  # Catches the tests' emails (same as docker-compose.yml).
  - name: mailpit
    image: axllent/mailpit:v1.31.4

# Built and pushed from a dev machine by scripts/ci-image.sh; tag = the Rust
# version in rust-toolchain.toml. The tag is reused when tools are added to the
# image: always fetch the latest.
variables:
  - &rust
    image: git.pband.ch/theca/ci-rust:1.98.0
    pull: true
    environment:
      DATABASE_URL: postgres://theca:theca@postgres:5432/theca
      # Builds use the committed .sqlx/ metadata, never the live database.
      SQLX_OFFLINE: "true"
      MAILPIT_TEST_HOST: mailpit

steps:
  # Licenses and advisories: no build, so it runs alongside the others.
  - name: deny
    <<: *rust
    depends_on: []
    commands:
      - scripts/ci.sh deny

  - name: lint
    <<: *rust
    depends_on: []
    commands:
      - scripts/ci.sh lint

  - name: test
    <<: *rust
    depends_on: [lint]
    commands:
      - scripts/ci.sh test

  - name: wasm
    <<: *rust
    depends_on: [test]
    commands:
      - scripts/ci.sh wasm
