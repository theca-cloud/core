when:
  - event: [push, pull_request, manual]

services:
  - name: postgres
    image: postgres:18
    environment:
      POSTGRES_USER: theca
      POSTGRES_PASSWORD: theca
      POSTGRES_DB: theca
      # Same as docker-compose.yml: the server refuses other collations.
      POSTGRES_INITDB_ARGS: --locale-provider=builtin --builtin-locale=C.UTF-8

steps:
  - name: ci
    # Built and pushed from a dev machine by scripts/ci-image.sh;
    # tag = the Rust version in rust-toolchain.toml.
    image: git.pband.ch/theca/ci-rust:1.98.0
    # The tag is reused when tools are added to the image: always fetch the latest.
    pull: true
    environment:
      DATABASE_URL: postgres://theca:theca@postgres:5432/theca
      # Builds use the committed .sqlx/ metadata, never the live database.
      SQLX_OFFLINE: "true"
    commands:
      - scripts/ci.sh
