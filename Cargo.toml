[workspace]
members = ["crates/common", "crates/core", "crates/client"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
argon2 = "0.6"
askama = "0.16"
# WebDAV over our own filesystem trait (no local or in-memory filesystem).
dav-server = { version = "0.11", default-features = false }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
axum = "0.8"
dotenvy = "0.15"
getrandom = "0.3"
hmac = "0.13"
# S3 with ring (not the "aws" feature, which pulls aws-lc-rs).
object_store = { version = "0.14", default-features = false, features = ["fs", "aws-base", "reqwest", "ring"] }
# rustls-no-provider: the "rustls" feature would pull aws-lc-rs; ring is installed in main.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
http = "1"
base64 = "0.22"
bytes = "1"
sha2 = "0.11"
tempfile = "3"
uuid = { version = "1", features = ["serde"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "json", "ipnetwork"] }
tower = "0.5"
utoipa = { version = "5", features = ["uuid"] }
fastcdc = { version = "5.0.0", features = ["futures"] }
futures = "0.3.34"
lz4_flex = "0.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
twox-hash = { version = "2.1.5", default-features = false, features = ["xxhash3_128"] }
unicode-normalization = "0.1.25"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "io-util", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# SMTP over rustls with ring (like everything else), certificates checked by the platform.
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "hostname", "tokio1-rustls", "ring", "rustls-platform-verifier"] }
# No default features: its HTTP client is ours (reqwest 0.13, see oidc.rs).
openidconnect = { version = "4", default-features = false }
# otpauth: the otpauth:// URI for QR codes. Secrets are generated by us (getrandom).
totp-rs = { version = "6", default-features = false, features = ["std", "otpauth"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Password hashing is deliberately slow; unoptimized it makes tests crawl.
# Debug info is most of target/'s size (every test binary carries it for every
# dependency): line tables for our code (backtraces keep file:line), none for
# dependencies.
[profile.dev]
debug = "line-tables-only"
[profile.dev.package."*"]
debug = false

[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
