[workspace]
members = ["crates/common", "crates/core", "crates/client"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
axum = "0.8"
dotenvy = "0.15"
getrandom = "0.3"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate"] }
tower = "0.5"
utoipa = "5"
fastcdc = { version = "5.0.0", features = ["futures"] }
futures = "0.3.34"
lz4_flex = "0.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
twox-hash = { version = "2.1.5", default-features = false, features = ["xxhash3_128"] }
unicode-normalization = "0.1.25"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "io-util", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
