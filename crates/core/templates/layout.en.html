<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>{{ e.instance_name }}</title></head>
<body style="margin:0;padding:24px;background:#f4f4f5;font-family:-apple-system,Segoe UI,Roboto,sans-serif;color:#18181b">
  <div style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:8px;padding:32px">
    <p style="margin:0 0 24px;font-weight:600">{{ e.instance_name }}</p>
    {% block content %}{% endblock %}
    <p style="margin:32px 0 0;font-size:12px;color:#71717a">{{ e.public_url }}</p>
  </div>
</body>
</html>
