[package]
name = "theca-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# rlib for Rust clients, cdylib for the browser package (wasm-pack).
crate-type = ["rlib", "cdylib"]

[dependencies]
futures.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
theca-common = { path = "../common" }
thiserror.workspace = true
uuid.workspace = true
# Instant on both platforms (std's panics in the browser).
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rustls.workspace = true
tokio = { workspace = true, features = ["time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Blob", "File"] }

[dev-dependencies]
tokio = { workspace = true, features = ["time", "macros", "rt"] }

[lints]
workspace = true
