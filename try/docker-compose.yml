name: theca-try

# A local Theca from the released image. Run ./run.sh rather than
# `docker compose up` directly: it writes the secrets this file mounts.
services:
  postgres:
    image: postgres:18
    # As you (run.sh sets it): data/ stays yours to read and delete.
    user: ${HOST_USER}
    environment:
      POSTGRES_USER: theca
      POSTGRES_PASSWORD: theca
      POSTGRES_DB: theca
      POSTGRES_INITDB_ARGS: --locale-provider=builtin --builtin-locale=C.UTF-8
    volumes:
      - ./data/db:/var/lib/postgresql
    healthcheck:
      test: pg_isready -U theca -d theca
      interval: 2s
      timeout: 2s
      retries: 15

  theca:
    image: ${THECA_IMAGE:-git.pband.ch/theca/core:latest}
    user: ${HOST_USER}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL__FILE: /run/secrets/database_url
      SERVER_KEY__FILE: /run/secrets/server.key
      DATA_KEY__FILE: /run/secrets/data.key
      PUBLIC_URL: http://localhost:8090
      # run.sh sets the instance up right after the first start.
      SETUP_OPEN: "true"
    volumes:
      - ./data/secrets:/run/secrets:ro
      # The storage set up by run.sh.
      - ./data/files:/files
    ports:
      - 127.0.0.1:8090:8080
    healthcheck:
      test: ["CMD", "/theca-server", "healthcheck"]
      interval: 2s
      timeout: 2s
      retries: 30
